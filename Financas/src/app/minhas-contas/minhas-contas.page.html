<ion-header>
  <ion-toolbar>

    <!-- botão do menu -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>Minhas Contas</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
  <ion-item *ngFor="let conta of contas">

    <ion-label>
      <h2>{{ conta.nome }}</h2>
      <p>R$ {{ conta.valor }}</p>
      <p>Vencimento: {{ conta.dataVencimento }}</p>

      <p *ngIf="conta.pago">🟢 Pago</p>
      <p *ngIf="!conta.pago">🟡 Pendente</p>
    </ion-label>

    <ion-button (click)="marcarComoPago(conta)">
      Pagar
    </ion-button>

  </ion-item>
</ion-list>
</ion-content>
